<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller 3-1 Cohen-Sutherland</title>

    <style>
        body{
            margin:0;
            padding:0;
            background:#1e1e1e;
            color:white;
            font-family:Arial, Helvetica, sans-serif;

            display:flex;
            flex-direction:column;
            align-items:center;
        }

        h1{
            margin-top:20px;
        }

        canvas{
            border:2px solid white;
            background:black;
            margin-top:20px;
        }

        .controls{
            margin-top:20px;
        }

        input{
            width:70px;
            padding:5px;
            margin:5px;
        }

        button{
            padding:10px 20px;
            margin:10px;
            cursor:pointer;
        }
    </style>
</head>
<body>

    <h1>Algoritmo Cohen-Sutherland</h1>

    <div class="controls">

        <label>xmin</label>
        <input type="number" id="xmin" value="100">

        <label>ymin</label>
        <input type="number" id="ymin" value="100">

        <label>xmax</label>
        <input type="number" id="xmax" value="400">

        <label>ymax</label>
        <input type="number" id="ymax" value="300">

        <br>

        <button id="prevBtn">Anterior</button>
        <button id="nextBtn">Siguiente</button>

    </div>

    <canvas id="canvas" width="600" height="500"></canvas>

    <script src="script.js"></script>

</body>
</html>
